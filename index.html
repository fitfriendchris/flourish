<!-- Self-hosted variable fonts.
     The Google Fonts <link> was render-blocking on a third-party origin: browser
     testing measured 12,474 ms of a 12,592 ms load waiting on it, and in the offline
     iOS shell it never resolves at all. Two local woff2 files (86 KB) cover every
     weight, load from our own origin, and work with no network. -->
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/inter.woff2?v=3100e775) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 900;font-display:swap;
  src:url(fonts/playfair.woff2?v=1d1889ac) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
</style>
<style>
:root{
  --brand-900:#0a1810;--brand-800:#0f241a;--brand-700:#163623;--brand-600:#1f4a31;
  --brand-500:#2e6b46;--brand-400:#41956220;--brand-400s:#419562;--brand-300:#74c096;
  --gold-600:#b8860b;--gold-500:#d9a921;--gold-400:#ecc451;--gold-300:#f6df9c;
  --radius:18px;--radius-sm:12px;--radius-lg:18px;--radius-xl:24px;
  --s1:8px;--s2:16px;--s3:24px;--s4:32px;
  --fs-h1:30px;--fs-h2:22px;--fs-h3:18px;--fs-body:15px;--fs-small:13px;
  --header:60px;--nav:80px;--maxw:560px;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --sh-sm:0 1px 2px rgba(0,0,0,.2);--sh:0 10px 30px rgba(0,0,0,.22);--sh-lg:0 22px 60px rgba(0,0,0,.36);
}
html[data-theme="dark"]{
  --bg:#091410;--bg2:#0d1d15;--bg3:#0a1912;--surface:#122418;--surface2:#172f1f;--surface3:#1e3b28;
  --line:#264133;--line2:#32543f;--text:#ecf5ee;--text-dim:#a7c4b2;--text-faint:#8fa892;
  --accent:#74c096;--accent-strong:#419562;--gold:#ecc451;
  --health:#5cc2b0;--wealth:#ecc451;--rel:#ea93b1;--intg:#a99bf0;
  --health-bg:#0f3a32;--wealth-bg:#3b3210;--rel-bg:#3c2029;--intg-bg:#241f3d;--glass:rgba(12,24,18,.72);
}
html[data-theme="light"]{
  --bg:#f1ebdb;--bg2:#ece3cf;--bg3:#f5efe1;--surface:#fffdf7;--surface2:#f9f3e7;--surface3:#f1e8d4;
  --line:#e2d6bb;--line2:#d3c4a0;--text:#172419;--text-dim:#4c5d51;--text-faint:#5a695d;
  --accent:#1f6e45;--accent-strong:#16532f;--gold:#7f5a04;
  --health:#0e6e62;--wealth:#7f5a04;--rel:#a0365c;--intg:#5b46c4;
  --health-bg:#dff0ea;--wealth-bg:#f5ebcc;--rel-bg:#f7e2ea;--intg-bg:#e9e5fa;--glass:rgba(250,246,236,.8);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* Opaque page ground straight from the token. The body background is a stack of
   gradients whose final layer uses background-attachment:fixed; WKWebView renders that
   unreliably, and CSS background propagation was the only thing painting the overscroll
   area. One solid colour underneath makes the ground correct in both themes regardless
   of either — otherwise iOS rubber-band scrolling flashes white on a dark app. */
html{background-color:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(140% 70% at 100% -10%,color-mix(in srgb,var(--gold-500) 9%,transparent),transparent 60%),
    radial-gradient(130% 60% at 0% 0%,color-mix(in srgb,var(--brand-500) 22%,transparent),transparent 55%),
    linear-gradient(180deg,var(--bg2),var(--bg)) fixed;}
h1,h2,h3,h4,.serif{font-family:'Playfair Display',Georgia,serif;letter-spacing:-.01em}
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent);text-decoration:none;font-weight:600}
.muted{color:var(--text-dim)}.faint{color:var(--text-faint)}.center{text-align:center}.hidden{display:none!important}
/* The hidden attribute is only a UA-stylesheet display:none, so any element that
   sets display inline (the privacy notice is display:flex) ignores it entirely. */
[hidden]{display:none!important}
::-webkit-scrollbar{width:0;height:0}

/* HEADER */
.app-header{position:sticky;top:0;z-index:60;height:var(--header);display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand .logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(145deg,var(--brand-400s),var(--brand-700));box-shadow:var(--sh-sm),inset 0 1px 0 rgba(255,255,255,.15)}
.brand .title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700}
.hicons{display:flex;align-items:center;gap:7px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;color:var(--text-dim);transition:.2s var(--ease);border:1px solid transparent}
.iconbtn:hover{background:var(--surface2);color:var(--text)}.iconbtn:active{transform:scale(.9)}
.chip{padding:8px 13px;border-radius:999px;background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);font-size:13px;font-weight:800;display:inline-flex;gap:6px;align-items:center}
.chip:active{transform:scale(.94)}

/* MAIN + NAV */
main{padding:14px 15px calc(var(--nav) + 40px);animation:pageIn .4s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(var(--maxw),95vw);height:var(--nav);
  display:flex;justify-content:space-around;align-items:center;z-index:55;padding:0 6px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--sh-lg)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-faint);font-size:11px;font-weight:700;padding:9px 2px;border-radius:16px;transition:.25s var(--ease);position:relative}
.nav-btn .ni{font-size:21px;line-height:1;transition:.25s var(--spring);filter:grayscale(.3)}
.nav-btn.active{color:var(--accent)}
.nav-btn.active .ni{transform:translateY(-3px) scale(1.15);filter:none}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.nav-btn:active{transform:scale(.92)}

/* SUB-PAGE HEADER (nav architecture) */
.subhead{position:sticky;top:var(--header);z-index:30;display:flex;align-items:center;gap:10px;margin:-14px -15px 14px;padding:11px 15px;
  background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.subhead .nb{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:17px;font-weight:800;transition:.18s}
.subhead .nb:active{transform:scale(.88)}.subhead .nb:hover{border-color:var(--accent)}
.subhead .st{flex:1;min-width:0}.subhead .st b{font-family:'Playfair Display',serif;font-size:17px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subhead .st small{font-size:11.5px;color:var(--text-faint);font-weight:600}
.crumb{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin:2px 2px 6px}

/* CARDS */
.card{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--bg)));border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--sh-sm);margin-bottom:14px;transition:.2s var(--ease);animation:pop .35s var(--ease)}
button.card{display:block;width:100%;text-align:left}
.card:active{transform:scale(.99)}
.card.glow{background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 10%,var(--surface2)),var(--surface));border-color:color-mix(in srgb,var(--accent) 34%,var(--line));box-shadow:var(--sh),0 0 0 1px color-mix(in srgb,var(--accent) 14%,transparent)}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-hd h3{font-size:17px}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:15px 0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}

/* BUTTONS — bigger, tactile, with press feedback */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:14px 20px;border-radius:15px;font-weight:800;font-size:15px;letter-spacing:.1px;
  transition:transform .12s var(--ease),box-shadow .2s,filter .2s;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line2);color:var(--text);position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,var(--brand-400s),var(--brand-600));border:none;color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--brand-500) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.gold{background:linear-gradient(180deg,var(--gold-400),var(--gold-600));border:none;color:#211603;box-shadow:0 8px 20px color-mix(in srgb,var(--gold-500) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.sm{min-height:40px;padding:9px 15px;font-size:13.5px;border-radius:12px}
.btn.lg{min-height:58px;font-size:16.5px;border-radius:17px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn .arr{font-size:18px;transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.btnrow{display:flex;gap:10px}.btnrow>.btn{flex:1}
.btnrow>.btn.back{flex:0 0 auto;min-width:56px;padding:14px 16px}
.pill{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface3);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.pill.health{color:var(--health);background:var(--health-bg);border-color:transparent}
.pill.wealth{color:var(--wealth);background:var(--wealth-bg);border-color:transparent}
.pill.rel{color:var(--rel);background:var(--rel-bg);border-color:transparent}
.pill.intg{color:var(--intg);background:var(--intg-bg);border-color:transparent}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:5px 9px;border-radius:7px;background:var(--surface3);color:var(--text-dim)}

/* PROGRESS */
.ring{--p:0;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface3) 0)}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-weight:900;font-size:14px}
.bar{height:11px;border-radius:999px;background:var(--surface3);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));transition:width .7s var(--ease)}
.bar.gold>i{background:linear-gradient(90deg,var(--gold-400),var(--gold-600))}

/* STATS */
.stat{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 10px;text-align:center}
.stat .n{font-size:26px;font-weight:800;font-family:'Playfair Display',serif;line-height:1}
.stat .l{font-size:11px;color:var(--text-faint);margin-top:5px;font-weight:700}
.stat .ic{font-size:20px;margin-bottom:2px}

/* HERO */
.hero{position:relative;border-radius:var(--radius-lg);padding:24px;overflow:hidden;color:#fff;
  background:linear-gradient(155deg,var(--brand-500),var(--brand-800) 75%);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.1)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--gold-400) 45%,transparent),transparent 70%)}
.hero::before{content:"✦";position:absolute;left:16px;bottom:8px;font-size:60px;opacity:.07;font-family:serif}
.hero .ref{color:var(--gold-300);font-weight:800;font-size:12.5px;letter-spacing:.8px;position:relative;z-index:1}
.hero .v{font-family:'Playfair Display',serif;font-size:22px;line-height:1.38;margin:9px 0 4px;position:relative;z-index:1;font-weight:600}

/* LISTS */
.list-item{display:flex;align-items:center;gap:13px;padding:13px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);margin-bottom:10px;transition:.18s var(--ease);width:100%;text-align:left}
.list-item:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));transform:translateX(2px)}
.list-item:active{transform:scale(.99)}
.list-item .av{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--surface3);flex:none}
.list-item .tx{flex:1;min-width:0}.list-item .tx b{display:block;font-size:14.5px}.list-item .tx small{color:var(--text-faint);font-size:12px}

.shead{display:flex;align-items:baseline;justify-content:space-between;margin:20px 4px 11px}
.shead h2{font-size:21px}.shead a{font-size:12.5px;font-weight:800}
.page-title{font-size:30px;margin:8px 4px 2px;font-weight:800}
.page-sub{color:var(--text-dim);font-size:14px;margin:0 4px 16px;line-height:1.45}

/* BADGES / XP */
.badge{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:27px;margin:0 auto;
  background:radial-gradient(circle at 30% 25%,var(--surface3),var(--surface2));border:1px solid var(--line)}
.badge.earned{background:linear-gradient(150deg,var(--gold-400),var(--gold-600));color:#211603;border:none;box-shadow:0 8px 20px color-mix(in srgb,var(--gold-500) 42%,transparent)}
.badge.locked{opacity:.4;filter:grayscale(1)}
.lvl{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--brand-400s),var(--brand-700));color:#fff;display:grid;place-items:center;font-weight:900;flex:none;box-shadow:var(--sh-sm)}

/* TABS / SEG */
.tabs{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:15px;padding:5px;margin-bottom:15px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;min-height:38px;padding:9px 13px;border-radius:11px;font-weight:800;font-size:13px;color:var(--text-dim);transition:.2s}
.tabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:34px;padding:7px 14px;border-radius:9px;font-weight:800;font-size:12.5px;color:var(--text-dim)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}

/* MODAL / SHEET */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:90;display:grid;place-items:end center;animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:var(--maxw);max-height:92vh;overflow-y:auto;position:relative;
  background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line2);border-radius:26px 26px 0 0;
  padding:16px 17px calc(env(safe-area-inset-bottom) + 26px);animation:up .4s var(--spring);box-shadow:var(--sh-lg)}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 10px}
.sheet-x{position:absolute;right:14px;top:13px;width:34px;height:34px;border-radius:10px;background:var(--surface3);display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--text-dim);z-index:2}
.sheet-x:active{transform:scale(.9)}

/* DEVOTIONAL BLOCKS */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:14px}
.daynav .dn{width:46px;height:46px;border-radius:13px;background:var(--surface3);display:grid;place-items:center;font-size:20px;font-weight:800;transition:.18s}
.daynav .dn:active{transform:scale(.88)}.daynav .dn:disabled{opacity:.3}
.daynav .dc{text-align:center;line-height:1.15}.daynav .dc b{font-family:'Playfair Display',serif;font-size:16px}.daynav .dc small{display:block;font-size:11px;color:var(--text-faint);font-weight:700}
.block{border-left:3px solid var(--line2);padding:6px 0 6px 15px;margin:16px 0}
.block .bh{font-size:11.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:flex;gap:7px;align-items:center}
.block.app{border-color:var(--health)}.block.app .bh{color:var(--health)}
.block.wis{border-color:var(--gold)}.block.wis .bh{color:var(--gold)}
.block.refl{border-color:var(--rel)}.block.refl .bh{color:var(--rel)}
.wisquote{background:linear-gradient(160deg,var(--surface3),var(--surface2));border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 15px;margin:9px 0;position:relative}
.wisquote::before{content:"\201C";position:absolute;left:8px;top:-6px;font-size:42px;color:var(--gold);opacity:.3;font-family:Georgia,serif}
.wisquote .q{font-family:'Playfair Display',serif;font-size:16px;font-style:italic;line-height:1.45}
.wisquote .src{font-size:12px;color:var(--gold);font-weight:800;margin-top:8px}
.checklist label{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.15s}
.checklist label:active{transform:scale(.99)}
