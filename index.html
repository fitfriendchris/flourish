<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flourish — Biblical Life Mastery</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="flourish-v10.css">
  <link rel="stylesheet" href="flourish-commerce.css">
  <link rel="stylesheet" href="flourish-cinematic.css">
  <meta name="theme-color" content="#0d1a11">
  <meta name="description" content="A 3-year journey of biblical life mastery across Health, Wealth, and Relationships — daily devotionals, guided plans, and your church community in one app.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://js.stripe.com https://nominatim.openstreetmap.org;">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta property="og:title" content="Flourish — Biblical Life Mastery">
  <meta property="og:description" content="A 3-year journey across Health, Wealth, and Relationships — 1,095 daily devotionals, 26 guided plans, and your church community in one app.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://flourish-8ql.pages.dev/">
  <meta property="og:image" content="https://flourish-8ql.pages.dev/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Flourish — Biblical Life Mastery">
  <meta name="twitter:description" content="Daily devotionals, guided plans, and your church community — hear, do, flourish.">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand"><span class="logo">🌱</span><span class="title">Flourish</span></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="auth-chip" aria-label="Account"></button>
        <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
        <button id="gender-toggle" aria-label="Toggle gender track">
          <span class="g-label label-men">Man</span>
        <span class="g-track"></span>
          <span class="g-label dim label-women">Woman</span>
        </button>
      </div>
    </header>
    <main id="main"></main>
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="devotional" aria-label="Today">
        <span class="nav-icon">📖</span><span class="nav-label">Today</span>
      </button>
      <button class="nav-btn" data-page="progress" aria-label="Journey">
        <span class="nav-icon">🌿</span><span class="nav-label">Journey</span>
      </button>
      <button class="nav-btn" data-page="pillars" aria-label="Pillars">
        <span class="nav-icon">📚</span><span class="nav-label">Pillars</span>
      </button>
      <button class="nav-btn" data-page="plans" aria-label="Plans">
        <span class="nav-icon">🗺️</span><span class="nav-label">Plans</span>
      </button>
      <button class="nav-btn" data-page="shop" aria-label="Store">
        <span class="nav-icon">🛒</span><span class="nav-label">Store</span>
      </button>
      <button class="nav-btn" data-page="church" aria-label="Church">
        <span class="nav-icon">⛪</span><span class="nav-label">Church</span>
      </button>
      <button class="nav-btn" data-page="profile" aria-label="Me">
        <span class="nav-icon">👤</span><span class="nav-label">Me</span>
      </button>
    </nav>
    <footer style="text-align:center;padding:1rem;font-size:.75rem;color:rgba(255,244,208,.4)">
      <a href="privacy.html" style="color:rgba(255,244,208,.5);text-decoration:none;margin:0 .5rem">Privacy Policy</a>
      <a href="terms.html" style="color:rgba(255,244,208,.5);text-decoration:none;margin:0 .5rem">Terms of Service</a>
      <div style="margin-top:.5rem">© 2026 Flourish. All rights reserved.</div>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="flourish-mana.js"></script>
  <script src="flourish-art.js"></script>
  <script src="flourish-commerce.js"></script>
  <script src="flourish-v10.js"></script>
</body>
</html>
